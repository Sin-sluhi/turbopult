const pad = n => String(n).padStart(2,"0");
const clock = ts => { const t = new Date(ts); return pad(t.getHours())+":"+pad(t.getMinutes()); };
function relTime(ts){
  const diff = Date.now()-ts;
  if(diff < m(1)) return "только что";
  if(diff < h(1)) return Math.floor(diff/60000)+" мин";
  const t = new Date(ts), today = new Date();
  if(t.toDateString() === today.toDateString()) return clock(ts);
  if(t.toDateString() === new Date(Date.now()-d(1)).toDateString()) return "вчера";
  return t.getDate()+" "+MONTHS[t.getMonth()].slice(0,3);
}
function dateShort(ts){ const t = new Date(ts); return t.getDate()+" "+MONTHS[t.getMonth()].slice(0,3)+" "+String(t.getFullYear()).slice(2); }
function dayLabel(ts){
  const t = new Date(ts);
  if(t.toDateString() === new Date().toDateString()) return "Сегодня";
  if(t.toDateString() === new Date(Date.now()-d(1)).toDateString()) return "Вчера";
  return t.getDate()+" "+MONTHS[t.getMonth()];
}

function plural(n,one,few,many){

}

/* ================= присутствие =================
   Мессенджеры не сообщают, открыт ли у клиента чат, — только что он
   написал. Поэтому считаем честно: писал меньше 5 минут назад — в чате;
   пишет прямо сейчас — оранжевый; дольше 5 минут тишины — уже не в чате,
   и показываем, когда был последний раз, а не растущее «в чате N мин». */
function presence(c){
  const p = c.pres || {state:"left", since:0, typing:false};
  const e = Date.now() - p.since;
  if(!p.since) return {k:"red", label:"не в чате"};
  if(p.state === "left") return {k:"red", label:"вышел " + (e < m(1) ? "только что" : relAgo(e))};
  if(p.typing)  return {k:"orange", label:"печатает…"};
  if(e < FIVE)  return {k:"green",  label:"в чате · " + (e < m(1) ? "только что писал" : "писал " + relAgo(e))};
  return {k:"red", label:"не в чате · был " + relAgo(e)};
}
function relAgo(ms){
  if(ms < h(1)) return mins(ms)+" мин назад";
  if(ms < d(1)){ const n = Math.floor(ms/3600000); return n+" "+plural(n,"час","часа","часов")+" назад"; }
  const n = Math.floor(ms/86400000);
  return n+" "+plural(n,"день","дня","дней")+" назад";
}

/* ================= умный поиск по архиву =================
   Русский язык склоняет всё подряд, поэтому сравниваем не слова целиком,
   а основы: «ключа», «ключом», «ключи» дают одну основу «ключ».
   Плюс словарь синонимов — «hasp» и «лицензия» ищутся вместе с «ключом». */
const SYNONYMS = {
  "ключ":["hasp","лицензи","активац","sentinel","защит"],
  "лицензи":["ключ","hasp","активац"],
  "арпс":["xml","выгруз","обмен","формат"],
  "выгруз":["арпс","xml","экспорт","обмен"],
  "кс":["акт","ведомост","накопительн"],
  "акт":["кс","ведомост"],
  "тсн":["территориальн","норматив","индекс"],
  "фснб":["фер","гэсн","база","дополнен","норматив"],
  "обновлен":["дополнен","сборк","версия"],
  "счет":["оплат","реквизит","кп","предложен"],
  "обучен":["вебинар","курс","методичк"],
  "устан":["настройк","развертыван","служб"]
};
const STOP = new Set(["и","в","на","не","с","по","а","что","как","для","от","до","за","у","о","об","к","из","же","ли","бы","или","это","при","мне","мы","вы","он","она","они","есть","был","было","быть","мой","наш","ваш"]);

function stem(w){
  w = w.toLowerCase().replace(/ё/g,"е").replace(/[^a-zа-я0-9-]/g,"");
  if(w.length <= 4) return w;
  return w.replace(/(ами|ями|ость|ений|ения|ение|ыми|ими|ого|его|ому|ему|ая|ое|ые|ый|ой|ий|ем|ом|ах|ях|ам|ям|ов|ев|ью|ия|ие|у|ю|а|я|ы|и|е|ь)$/,"").slice(0,9);
}
function tokenize(s){
  return String(s||"").split(/[^a-zA-Zа-яА-ЯёЁ0-9-]+/)
    .map(w => w.toLowerCase())
    .filter(w => w.length > 1 && !STOP.has(w))
    .map(stem)
    .filter(Boolean);
}
/* Короткое слово не должно совпадать с длинным термином только по первой
   букве: иначе предлог «в» считается совпадением с «видит», подсвечивается
   и раздувает оценку. Префикс засчитываем от четырёх символов. */
function hits(word, term){
  if(word === term) return true;
  if(word.length < 4 || term.length < 4) return false;
  return word.startsWith(term) || term.startsWith(word);
}
function expand(tokens){
  const out = new Map();
  tokens.forEach(t => {
    out.set(t, 1);
    Object.keys(SYNONYMS).forEach(key => {
      if(t.startsWith(key) || key.startsWith(t)){
        SYNONYMS[key].forEach(s => { if(!out.has(s)) out.set(s, 0.55); });
      }
    });
  });
  return out;
}

function searchArchive(raw){
  const base = tokenize(raw);
  if(!base.length) return [];
  const terms = expand(base);
  const results = [];

  convs.filter(c => c.status === "archived").forEach(c => {
    const fields = [
      {text:c.topic, w:3},
      {text:c.intake ? c.intake.org : "", w:1.5},
      {text:c.name, w:1.5},
      {text:c.tags.join(" "), w:2.5},
      {text:foldersOf(c).map(k => FBY[k] ? FBY[k].n : "").join(" "), w:2},
      {text:c.msgs.map(x => x.t).join(" "), w:1}
    ];

    let score = 0;
    const hit = new Set();
    terms.forEach((weight, term) => {
      let found = false;
      fields.forEach(f => {
        const words = tokenize(f.text);
        const n = words.filter(w => hits(w, term)).length;
        if(n){ score += n * f.w * weight; found = true; }
      });
      if(found && weight === 1) hit.add(term);
    });

    if(!score) return;
    // все слова запроса нашлись — такой ответ почти наверняка тот самый
    if(hit.size === base.length && base.length > 1) score *= 2.2;
    results.push({conv:c, score, terms:[...terms.keys()], hit:[...hit]});
  });

  return results.sort((a,b) => b.score - a.score).slice(0, 40);
}

function bestSnippet(c, terms){
  let best = null, bestN = -1;
  c.msgs.filter(x => x.dir !== "sys" && x.t).forEach(msg => {
    const words = tokenize(msg.t);
    const n = terms.filter(t => words.some(w => hits(w, t))).length;
    if(n > bestN){ bestN = n; best = msg; }
  });
  return best ? best.t : c.topic;
}

function highlight(text, terms){
  const frag = document.createDocumentFragment();
  const parts = String(text).split(/([a-zA-Zа-яА-ЯёЁ0-9-]+)/);
  parts.forEach(p => {
    const s = stem(p);
    const isHit = s && terms.some(t => hits(s, t));
    if(isHit && /[a-zA-Zа-яА-ЯёЁ0-9]/.test(p)) frag.append(el("mark", null, p));
    else frag.append(document.createTextNode(p));
  });
  return frag;
}

function intakeCard(c){
  const ik = c.intake;
  const box = el("div","intake");

  svg.setAttribute("width","14"); svg.setAttribute("height","14");

  svg.setAttribute("stroke-linecap","round"); svg.setAttribute("stroke-linejoin","round");
  const p = document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d","M3 8.4l3 3 7-7"); svg.append(p);
  // Анкета теперь идёт параллельно с вопросом — показываем, на каком она этапе
  const st = ik.status || "done";
  const HEAD = {done:"Анкета заполнена", active:"Клиент заполняет анкету",
                skipped:"Клиент отложил анкету", none:"Анкета ещё не заполнена"};
  box.classList.add("st-" + st);
  head.append(svg, document.createTextNode(HEAD[st] || HEAD.done));

  const dl = document.createElement("dl");

                  empty ? "не указано" : value);
    cell.append(dd);

  };

  f("Организация", ik.org);
  f("Имя и фамилия", ik.fio);
  f("Телефон", ik.phone, true);
  box.append(dl);
  return box;
}

/* Картинку показываем сразу: оператору важно увидеть скриншот ошибки,
   а не имя файла. Остальные файлы остаются ссылкой на скачивание. */
function attachment(att){
  const isImage = (att.kind || "").indexOf("image") === 0 ||
                  /\.(jpe?g|png|gif|webp|bmp|heic)$/i.test(att.n || "");

  if(att.url && isImage){
    const a = el("a","shotwrap");
    a.href = att.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.title = att.n + (att.s ? " · " + att.s : "");
    const img = document.createElement("img");
    img.className = "shot";
    img.src = att.url;
    img.alt = att.n || "Вложение";
    img.loading = "lazy";
    a.append(img);
    return a;
  }

  const box = att.url ? el("a","att") : el("div","att");
  if(att.url){ box.href = att.url; box.target = "_blank"; box.rel = "noopener"; box.download = att.n; }
  box.append(el("span","ic", att.k), el("span",null, att.n), el("span","sz", att.s));
  return box;
}

let todayStats = null, todayAt = 0, todayBusy = false;

/* Демо без сервера — считаем по тем сообщениям, что есть в памяти */
function localToday(){
  const day0 = new Date(); day0.setHours(0,0,0,0);
  const t0 = day0.getTime();
  const st = {new_convs:0, clients:0, in_msgs:0, out_msgs:0, archived:0, waiting:waitingConvs().length,
              avg_reply_min:null, typical:null};
  const who = new Set(), perDay = {};
  let replySum = 0, replyN = 0;
  convs.forEach(c => {
    const real = c.msgs.filter(x => x.dir !== "sys");
    if(!real.length) return;
    const first = real[0].ts;
    if(first >= t0) st.new_convs++;
    else if(first >= t0 - d(14)){ const k = dayKey(first); perDay[k] = (perDay[k]||0) + 1; }
    let pendingIn = null;
    real.forEach(x => {
      if(x.ts >= t0 && x.dir === "in"){ st.in_msgs++; who.add(c.id); }
      if(x.ts >= t0 && x.dir === "out") st.out_msgs++;
      if(x.dir === "in" && pendingIn === null) pendingIn = x.ts;
      if(x.dir === "out" && pendingIn !== null){
        if(pendingIn >= t0){ replySum += x.ts - pendingIn; replyN++; }
        pendingIn = null;
      }
    });
    if(c.status === "archived" && archivedAt(c) >= t0) st.archived++;
  });
  st.clients = who.size;
  if(replyN) st.avg_reply_min = Math.round(replySum / replyN / 6000) / 10;
  const days = Object.keys(perDay);
  if(days.length) st.typical = Math.round(days.reduce((a,k) => a + perDay[k], 0) / days.length * 10) / 10;
  return st;
}

function fetchToday(){
  if(!LIVE) return;                        // демо считается на месте, кэш не нужен
  if(todayBusy || Date.now() - todayAt < 30000) return;
  todayBusy = true;
  api("/api/today")
    .then(st => { todayStats = st; todayAt = Date.now(); if(!activeId && section === "inbox") renderIdle(); })
    .catch(e => console.warn("сводка дня не получена:", e.message))
    .finally(() => { todayBusy = false; });
}

/* Оценка дня: сравниваем поток с обычным к этому часу рабочего дня,
   добавляем очередь и скорость ответа. Четыре ступени — от спокойного
   до аврала. */
const LOADS = [
  {n:"Спокойный день",   c:"var(--ok)"},
  {n:"Обычный день",     c:"var(--acc)"},
  {n:"Напряжённый день", c:"var(--warn)"},
  {n:"Аврал",            c:"var(--crit)"}
];
function dayLoad(st){
  const now = new Date();
  const hr = now.getHours() + now.getMinutes() / 60;
  const frac = Math.min(1, Math.max(0.15, (hr - 9) / 9));    // к этому часу обычно пришла такая доля
  const typical = st.typical || 5;                            // истории ещё нет — считаем обычным ~5 в день
  const expected = typical * frac;
  const ratio = st.new_convs / Math.max(expected, 1);

  let score = ratio < 0.6 ? 0 : ratio < 1.3 ? 1 : ratio < 2 ? 2 : 3;
  if(st.waiting >= 5 || (st.avg_reply_min || 0) > 30) score = Math.min(3, score + 1);
  if(!st.new_convs && !st.waiting) score = 0;

  const why = [];
  if(!st.new_convs) why.push("новых обращений пока нет");
  else if(ratio < 0.6) why.push("обращений меньше, чем обычно к этому часу");
  else if(ratio < 1.3) why.push("поток как обычно");
  else why.push("обращений в " + (Math.round(ratio * 10) / 10).toString().replace(".", ",") + " раза больше обычного");
  if(st.waiting) why.push(st.waiting + " " + plural(st.waiting,"клиент ждёт","клиента ждут","клиентов ждут") + " ответа");
  if(st.avg_reply_min != null) why.push("отвечаем в среднем за " + String(st.avg_reply_min).replace(".", ",") + " мин");
  return {score, lv:LOADS[score], why:why.join(" · "), guess:!st.typical};
}

function renderIdle(){

    box.append(wrap);
  }
  fetchToday();
  // Пока сервер не прислал цифры — не показываем нули, а честно ждём
  const pending = LIVE && !todayStats;

                                     waiting:waitingConvs().length, avg_reply_min:null, typical:null})

              el("p","idate", WD_FULL[now.getDay()] + ", " + now.getDate() + " " + MONTHS[now.getMonth()] + " · " + clock(now.getTime())));

  const grid = el("div","igrid");

  /* оценка дня */

  lc.append(lh, meter, el("p",null, pending ? "Считаю цифры дня…"
    : load.why + (load.guess ? " · обычный день пока оцениваю грубо — мало истории" : "")));
  if(pending) lc.classList.add("wait");
  left.append(lc);

  /* цифры дня */
  const dc = el("div","icard");
  dc.append(el("div","ittl","Сегодня"));
  const cells = el("div","icells");
  [[st.new_convs, plural(st.new_convs,"новое обращение","новых обращения","новых обращений")],
   [st.clients, plural(st.clients,"клиент написал","клиента написали","клиентов написали")],
   [st.in_msgs, plural(st.in_msgs,"сообщение от клиентов","сообщения от клиентов","сообщений от клиентов")],
   [st.out_msgs, plural(st.out_msgs,"ответ отправлен","ответа отправлено","ответов отправлено")],
   [st.archived, "ушло в архив"],
   [st.avg_reply_min == null ? "—" : String(st.avg_reply_min).replace(".", ","), "мин — средний ответ"]
  ].forEach(p => {
    const d = el("div");
    d.append(el("b",null, pending ? "…" : String(p[0])), el("span",null,p[1]));
    cells.append(d);
  });
  dc.append(cells);
  left.append(dc);

  /* кто ждёт */
  const wait = waitingConvs();
  if(wait.length){
    const wc = el("div","icard");

      b.append(avatarBlock(x.c, 34), t, el("em",null, relAgo(Date.now() - x.lm.ts).replace(" назад","")));
      b.onclick = () => openConv(x.c.id);

let calMonth = null;         // первое число показанного месяца
let calDay = null;           // выбранный день "ГГГГ-ММ-ДД" или null
let askState = null;         // {q, loading, res}

const archivedAt = c => c.archivedAt || lastMsg(c).ts;
const dayKey = ts => { const t = new Date(ts); return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate()); };
const foldersOf = c => (c.folders && c.folders.length) ? c.folders : (c.folder ? [c.folder] : []);
const inFolder = (c, key) => GBY[key]
  ? foldersOf(c).some(k => FBY[k] && FBY[k].g === GBY[key])
  : foldersOf(c).includes(key);
const countIn = (list, key) => list.filter(c => inFolder(c, key)).length;

/* ---------- календарь ---------- */
const WD = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const WD_FULL = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
const MONTH_N = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];

function renderCalendar(){
  const box = $("#calBox");
  if(!box) return;
  box.textContent = "";
  const now = new Date();
  if(!calMonth) calMonth = new Date(now.getFullYear(), now.getMonth(), 1);

  // Шапка — сегодняшний день крупно, на неё и приятно смотреть
  const hero = el("div","calhero");
  const big = el("div","cbig", String(now.getDate()));
  const side = el("div","cside");
  side.append(el("b",null, MONTHS[now.getMonth()] + " " + now.getFullYear()),
              el("span",null, WD_FULL[now.getDay()]),
              el("i","cclock", clock(now.getTime())));
  hero.append(big, side);
  box.append(hero);

  // Сколько обращений ушло в архив по дням — оттенок ячейки
  const per = {};
  convs.filter(c => c.status === "archived").forEach(c => {
    const k = dayKey(archivedAt(c)); per[k] = (per[k]||0) + 1;
  });
  const max = Math.max(1, ...Object.values(per));

  const nav = el("div","calnav");
  const prev = el("button","iconbtn","‹"); prev.type = "button"; prev.setAttribute("aria-label","Предыдущий месяц");
  const next = el("button","iconbtn","›"); next.type = "button"; next.setAttribute("aria-label","Следующий месяц");
  prev.onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1); renderCalendar(); };
  next.onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1); renderCalendar(); };
  const title = el("button","calttl", MONTH_N[calMonth.getMonth()] + " " + calMonth.getFullYear());
  title.type = "button"; title.title = "К текущему месяцу";
  title.onclick = () => { calMonth = new Date(now.getFullYear(), now.getMonth(), 1); renderCalendar(); };
  nav.append(prev, title, next);
  box.append(nav);

  const grid = el("div","calgrid");
  WD.forEach((w,i) => grid.append(el("span","wd"+(i>4?" we":""), w)));
  const first = (calMonth.getDay() + 6) % 7;            // с понедельника
  const days = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 0).getDate();
  for(let i = 0; i < first; i++) grid.append(el("span","cd blank"));
  let monthTotal = 0;
  for(let dnum = 1; dnum <= days; dnum++){
    const dt = new Date(calMonth.getFullYear(), calMonth.getMonth(), dnum);
    const k = dayKey(dt.getTime());
    const n = per[k] || 0;
    monthTotal += n;
    const b = el("button","cd");
    b.type = "button";
    if(dt.getDay() === 0 || dt.getDay() === 6) b.classList.add("we");
    if(k === dayKey(now.getTime())) b.classList.add("today");
    if(k === calDay) b.classList.add("sel");
    if(n){ b.classList.add("has"); b.style.setProperty("--heat", String(0.18 + 0.62 * n / max)); }
    b.append(el("span",null,String(dnum)));
    if(n) b.append(el("i", "cdot"));
    b.title = n ? n + " " + plural(n,"обращение","обращения","обращений") + " в архив" : "";
    b.onclick = () => { calDay = calDay === k ? null : k; openFolder = null; closeCal(); setSection("archive"); };
    grid.append(b);
  }
  box.append(grid);

  const foot = el("div","calfoot");
  foot.append(el("b",null,String(monthTotal)),
              document.createTextNode(" " + plural(monthTotal,"обращение","обращения","обращений") + " ушло в архив за " + MONTH_N[calMonth.getMonth()].toLowerCase()));
  box.append(foot);
  if(calDay){
    const clr = el("button","ibtn wide","Показать все дни");
    clr.type = "button";
    clr.onclick = () => { calDay = null; closeCal(); if(section === "archive") renderArchive(); };
    box.append(clr);
  }
}

/* ---------- строка «спросить у базы» ---------- */
const ASK_EXAMPLES = [
  "Сколько пользователей написало про драйвер в сентябре?",
  "Сколько разговоров закончилось на 5-й минуте в этом месяце?",
  "Обращения по темам за месяц",
  "Обращения по разделам",
  "Среднее время разговора за 30 дней",
  "Обращения по дням за 14 дней"
];
const ASK_RX = /^\s*(сколько|скольк|какой|какая|какие|каков|кто|средн|топ|статистик|покажи|в каком|по месяц|по дням|по тем)/i;

function setMode(mode){
  aMode = mode;
  $("#modeFind").setAttribute("aria-pressed", String(mode === "find"));
  $("#modeAsk").setAttribute("aria-pressed", String(mode === "ask"));
  $("#aq").placeholder = mode === "ask"
    ? "Спросите цифрами: сколько пользователей написало про АРПС в сентябре?"
    : "Например: не видит ключ";
  $(".asearch").classList.toggle("ask", mode === "ask");
  renderArchive();
}

function runAsk(q){
  q = q.trim();
  if(!q) return;
  askState = {q:q, loading:true, res:null};
  renderArchive();
  const hist = store.get("askHist", []).filter(x => x !== q);
  hist.unshift(q); store.set("askHist", hist.slice(0,6));

  if(!LIVE){
    askState = {q:q, loading:false, res:{ok:false,
      answer:"В демо-режиме считать не из чего: строка отвечает по настоящей базе, когда пульт открыт с сервера."}};
    renderArchive();
    return;
  }
  api("/api/ask?q=" + encodeURIComponent(q))
    .then(res => { if(askState && askState.q === q){ askState = {q:q, loading:false, res:res}; renderArchive(); } })
    .catch(e => {
      // 404 — страница новая, а сервер ещё старый: строке не к кому обратиться
      const msg = /not found|404/i.test(e.message)
        ? "Сервер запущен в старой версии и пока не умеет отвечать. Перезапустите «Турбопульт — запустить» и спросите снова."
        : "Не получилось: " + e.message;
      askState = {q:q, loading:false, res:{ok:false, answer:msg}};
      renderArchive();
    });
}

function askCard(){
  const card = el("div","askcard");
  if(!askState){
    card.classList.add("intro");
    card.append(el("b",null,"Спросите у базы что угодно"),
                el("p",null,"Считает по всем обращениям: сколько людей, по каким темам, в какие дни, сколько длились разговоры. Нажмите Enter, чтобы спросить."));
    const ex = el("div","askex");
    const hist = store.get("askHist", []);
    (hist.length ? hist.concat(ASK_EXAMPLES).slice(0,6) : ASK_EXAMPLES).forEach(t => {
      const b = el("button","askchip", t);
      b.type = "button";
      b.onclick = () => { $("#aq").value = t; aQuery = t; runAsk(t); };
      ex.append(b);
    });
    card.append(ex);
    return card;
  }

  const q = el("div","askq");
  q.append(el("span","qm","?"), el("span",null, askState.q));
  card.append(q);
  if(askState.loading){ card.append(el("div","askload","Считаю…")); return card; }

  const r = askState.res || {};
  if(!r.ok){ card.append(el("div","askerr", r.answer || "Не понял вопрос")); return card; }

  if(r.value != null && !r.rows){
    const big = el("div","askbig");
    big.append(el("b",null, String(r.value).replace(".", ",")), el("span",null, r.unit || ""));
    card.append(big);
  } else if(r.rows){
    card.append(el("div","asktitle", r.title || r.answer));
    if(r.chart === "bar" && r.rows.length && typeof r.rows[0][1] === "number"){
      const mx = Math.max(1, ...r.rows.map(x => x[1] || 0));
      const bars = el("div","askbars");
      r.rows.forEach(row => {
        const line = el("div","abar");
        const fill = el("i"); fill.style.width = Math.max(2, 100 * (row[1]||0) / mx) + "%";
        const track = el("span","track"); track.append(fill);
        line.append(el("span","lbl", String(row[0] == null ? "—" : row[0])), track, el("b",null,String(row[1])));
        bars.append(line);
      });
      card.append(bars);
    } else {
      const t = el("table","asktbl");
      const hr = el("tr");
      (r.columns || []).forEach(cn => hr.append(el("th",null,cn)));
      t.append(hr);
      r.rows.forEach(row => {
        const tr = el("tr");
        row.forEach(v => tr.append(el("td",null, v == null ? "—" : String(v))));
        t.append(tr);
      });
      card.append(t);
    }
  }
  const meta = el("div","askmeta");
  if(r.understood) meta.append(el("span",null,"Понял так: " + r.understood));
  meta.append(el("span","eng", r.engine === "claude" ? "отвечает Claude" : "встроенный разбор"));
  card.append(meta);
  return card;
}

/* ---------- плитки папок ---------- */
function folderTile(f, n, opts){
  const b = el("button","ftile" + (n ? "" : " zero"));
  b.type = "button";
  b.style.setProperty("--fc", f.c);
  b.append(el("span","tn", f.n));
  if(opts && opts.count !== false) b.append(el("span","tc", String(n)));
  return b;
}

function folderTree(list, onPick, opts){
  opts = opts || {};
  const wrap = el("div","ftree" + (opts.compact ? " compact" : ""));
  const q = (opts.filter || "").toLowerCase();
  let shown = 0;
  GROUPS.forEach(g => {
    const gMatch = !q || g.n.toLowerCase().includes(q);
    const kids = g.kids.filter(f => gMatch || f.n.toLowerCase().includes(q));
    if(!kids.length) return;
    shown++;
    const card = el("section","fgroup");
    card.style.setProperty("--fc", g.c);
    const head = el(opts.compact ? "div" : "button","fghead");
    if(!opts.compact){ head.type = "button"; head.onclick = () => onPick(g.k, true); head.title = "Все обращения раздела"; }
    const t = el("div","ft");
    t.append(el("b",null,g.n), el("span",null,g.hint));
    head.append(folderIcon(g, opts.compact ? 30 : 38), t);
    if(opts.count !== false) head.append(el("span","fc", String(countIn(list, g.k))));
    card.append(head);
    const tiles = el("div","ftiles");
    kids.forEach(f => {
      const tile = folderTile(f, countIn(list, f.k), opts);
      const sel = Array.isArray(opts.selected) ? opts.selected.includes(f.k) : opts.selected === f.k;
      if(sel) tile.setAttribute("aria-pressed","true");
      tile.onclick = () => onPick(f.k, false);
      tiles.append(tile);
    });
    card.append(tiles);
    wrap.append(card);
  });
  if(!shown) wrap.append(el("div","empty","Подходящей папки нет — отправьте в «Не определённую тему»"));
  return wrap;
}

function undefTile(list, onPick, selected){
  const b = el("button","fundef");
  b.type = "button";
  if(selected) b.setAttribute("aria-pressed","true");
  const t = el("div","ft");
  t.append(el("b",null,UNDEF.n), el("span",null,UNDEF.hint));
  b.append(folderIcon(UNDEF, 34), t, el("span","fc", String(countIn(list, "undef"))));
  b.onclick = () => onPick("undef", false);
  return b;
}

/* ---------- экран архива ---------- */
function renderArchive(){
  const body = $("#aBody");
  const hint = $("#aHint");
  const askBox = $("#askBox");
  body.textContent = "";
  askBox.textContent = "";
  if(!$("#calBox").hidden) renderCalendar();
  const archived = convs.filter(c => c.status === "archived");
  $("#aCount").textContent = archived.length + " " + plural(archived.length,"обращение","обращения","обращений") + " в архиве";
  $("#aClear").hidden = !aQuery;

  /* --- вопрос к базе --- */
  if(aMode === "ask"){
    hint.textContent = "Пишите как человеку: период, тему, длительность разговора — Enter, и ответ появится ниже.";
    askBox.append(askCard());
  }

  /* --- умный поиск --- */
  if(aMode === "find" && aQuery.trim()){
    const res = searchArchive(aQuery);
    const folders = new Set(res.map(r => r.conv.folder));
    hint.textContent = res.length
      ? "Найдено " + res.length + " " + plural(res.length,"обращение","обращения","обращений") +
        " в " + folders.size + " " + plural(folders.size,"папке","папках","папках") +
        " · ищем по основам слов, склонение не мешает"
      : "";

    if(!res.length){
      body.append(emptyState("По запросу «"+aQuery+"» в архиве ничего нет. Попробуйте другие слова — например «ключ», «арпс», «индексы». А если нужны цифры — переключитесь на «Спросить у базы»."));
      return;
    }

    const rows = el("div","rows");
    res.forEach(r => {
      const c = r.conv;
      const b = el("button","rrow");
      b.type = "button";

      const t = el("div","rt");
      const l1 = el("div","l1");
      l1.append(el("b",null,c.name), folderChips(c));
      t.append(l1);

      const topic = el("div","l1");
      topic.style.marginTop = "5px";
      const tp = el("span");
      tp.style.fontSize = "12.5px";
      tp.style.color = "var(--ink-3)";
      tp.append(highlight(c.topic, r.terms));
      topic.append(tp);
      t.append(topic);

      const q = el("div","q");
      q.append(highlight(bestSnippet(c, r.terms), r.terms));
      t.append(q);

      const why = el("div","why");
      r.hit.forEach(term => why.append(el("span","tag", term)));
      if(r.hit.length) t.append(why);

      const side = el("div","rside");
      side.append(document.createTextNode(dateShort(lastMsg(c).ts)));
      side.append(el("span","score", "совпадение " + Math.min(99, Math.round(r.score*4)) + "%"));

      b.append(avatarBlock(c), t, side);
      b.onclick = () => { goInbox(c.id); };
      rows.append(b);
    });
    body.append(rows);
    return;
  }

  /* --- один день из календаря --- */
  if(calDay){
    if(aMode === "find") hint.textContent = "";
    const [y, mo, dd] = calDay.split("-").map(Number);
    const crumb = el("div","crumb");
    const back = el("button",null,"← Все папки");
    back.type = "button";
    back.onclick = () => { calDay = null; renderArchive(); };
    crumb.append(back, el("span",null,"·"), el("span",null, dd + " " + MONTHS[mo-1] + " " + y));
    body.append(crumb);
    const items = archived.filter(c => dayKey(archivedAt(c)) === calDay).sort((a,b) => archivedAt(b) - archivedAt(a));
    if(!items.length){ body.append(emptyState("В этот день в архив ничего не уходило")); return; }
    const rows = el("div","rows");
    items.forEach(c => rows.append(archiveRow(c)));
    body.append(rows);
    return;
  }

  /* --- содержимое раздела или темы --- */
  if(openFolder){
    if(aMode === "find") hint.textContent = "";
    const g = GBY[openFolder] || (FBY[openFolder] && FBY[openFolder].g);
    const f = FBY[openFolder];
    const crumb = el("div","crumb");
    const back = el("button",null,"← Все папки");
    back.type = "button";
    back.onclick = () => { openFolder = null; renderArchive(); };
    crumb.append(back);
    if(g){
      crumb.append(el("span",null,"·"));
      const gb = el("button",null,g.n);
      gb.type = "button";
      gb.onclick = () => { openFolder = g.k; renderArchive(); };
      crumb.append(gb);
    }
    if(f && f !== UNDEF){ crumb.append(el("span",null,"›"), el("span",null,f.n)); }
    if(openFolder === "undef") crumb.append(el("span",null,"·"), el("span",null,UNDEF.n));
    body.append(crumb);

    // Внутри раздела — его темы плитками, чтобы переключаться в один клик
    if(g){
      const tiles = el("div","ftiles inline");
      tiles.style.setProperty("--fc", g.c);
      g.kids.forEach(k => {
        const t = folderTile(k, countIn(archived, k.k));
        if(openFolder === k.k) t.setAttribute("aria-pressed","true");
        t.onclick = () => { openFolder = openFolder === k.k ? g.k : k.k; renderArchive(); };
        tiles.append(t);
      });
      body.append(tiles);
    }

    const items = archived.filter(c => inFolder(c, openFolder))
                          .sort((a,b) => lastMsg(b).ts - lastMsg(a).ts);
    if(!items.length){ body.append(emptyState("В этой папке пока пусто")); return; }
    const rows = el("div","rows");
    items.forEach(c => rows.append(archiveRow(c)));
    body.append(rows);
    return;
  }

  /* --- дерево папок --- */
  if(aMode === "find"){
    hint.textContent = "";
    hint.append(document.createTextNode("Поиск идёт по всем папкам сразу. Попробуйте: "));
    ["не видит ключ","выгрузка арпс","индексы","накопительная ведомость"].forEach((ex,i) => {
      if(i) hint.append(document.createTextNode(" · "));
      const code = el("code",null,ex);
      code.onclick = () => { $("#aq").value = ex; aQuery = ex; renderArchive(); };
      hint.append(code);
    });
  }

  body.append(el("div","secttl","Папки"));
  const pick = key => { openFolder = key; renderArchive(); };
  body.append(folderTree(archived, pick));
  body.append(undefTile(archived, pick, false));

  body.append(el("div","secttl","Недавно убрано в архив"));
  const rows = el("div","rows");
  archived.slice().sort((a,b) => archivedAt(b) - archivedAt(a)).slice(0,4).forEach(c => rows.append(archiveRow(c)));
  if(!archived.length) body.append(emptyState("Архив пока пуст"));
  body.append(rows);
}

/* Все папки обращения: две чипами, остальные — «+N» */
function folderChips(c){
  const box = document.createDocumentFragment();
  const list = foldersOf(c).map(k => FBY[k] || UNDEF);
  (list.length ? list : [UNDEF]).slice(0,2).forEach(f => box.append(folderChip(f)));
  if(list.length > 2){
    const more = el("span","fchip more","+" + (list.length - 2));
    more.title = list.slice(2).map(f => f.n).join(", ");
    box.append(more);
  }
  return box;
}
function folderChip(f){
  const fc = el("span","fchip");
  const dot = el("i"); dot.style.background = f.c;
  fc.append(dot, document.createTextNode(f.g ? f.g.n + " › " + f.n : f.n));
  return fc;
}

function archiveRow(c){
  const b = el("button","rrow");
  b.type = "button";
  const t = el("div","rt");
  const l1 = el("div","l1");
  l1.append(el("b",null,c.name), folderChips(c));
  const topic = el("div","q");
  topic.textContent = c.topic;
  t.append(l1, topic);
  const side = el("div","rside", dateShort(archivedAt(c)));
  b.append(avatarBlock(c), t, side);
  b.onclick = () => goInbox(c.id);
  return b;
}

/* ================= база клиентов: экран ================= */
const lastContact = cl => cl.convs.length
  ? Math.max.apply(null, cl.convs.map(id => lastMsg(byId(id)).ts))
  : (cl.lastTs || 0);

function clientMatches(cl){
  if(!cQuery) return true;
  const q = cQuery.toLowerCase();
  return (cl.name+" "+cl.un+" "+cl.org+" "+cl.lic+" "+cl.phone+" "+cl.product)
         .toLowerCase().includes(q);
}

function clientAvatar(cl, size){
  const wrap = el("div","avawrap");
  const ava = el("div","ava", initials(cl.name));
  ava.style.backgroundImage = "linear-gradient(145deg, color-mix(in srgb, "+cl.color+" 64%, #ffffff), "+cl.color+")";
  const ch = el("span","ch "+cl.provider, cl.provider === "tg" ? "T" : "M");
  ch.title = PROVIDER_L[cl.provider];
  wrap.append(ava, ch);
  if(size){ wrap.style.width = wrap.style.height = size+"px"; ava.style.width = ava.style.height = size+"px"; }
  return wrap;
}

    $("#cliSelBtn").hidden = true;
    $("#cliSelBar").hidden = true;
    hint.textContent = "";

    const crumb = el("div","crumb");
    const back = el("button",null,"← Все клиенты");

    const top = el("div","top");

    card.append(top);

    const dl = el("dl","info");
    const pair = (k,v,c2) => { dl.append(el("dt",null,k), el("dd", c2||null, v)); };
    pair("Канал", PROVIDER_L[cl.provider]);
    pair("Организация", cl.org);
    pair("Ключ / лицензия", cl.lic, "mono");
    pair("Телефон", cl.phone, "mono");
    pair("Продукт", cl.product);
    pair("Версия", cl.ver, "mono");
    pair("Сопровождение", cl.support, cl.support.indexOf("нет") === 0 ? "due" : "mono");
    const days = Math.round(cl.since/86400000);
    pair("Клиент", days > 365
      ? Math.floor(days/365)+" "+plural(Math.floor(days/365),"год","года","лет")
      : days+" "+plural(days,"день","дня","дней"));
    card.append(dl);

    const ms = el("div","sect");
    ms.append(el("h3",null,"Как разговаривать"));
    const pm = el("div","pmoods");
    MOODS.forEach(mo => {
      const b = el("button","moodopt");
      b.type = "button";
      b.style.setProperty("--mc", mo.c);
      b.dataset.mood = mo.k;
      b.setAttribute("aria-pressed", String(cl.mood === mo.k));
      const t = el("div");
      t.append(el("b",null,mo.n), el("span",null,mo.hint));
      b.append(el("i","mo"), t);
      b.onclick = () => {
        const next = cl.mood === mo.k ? "" : mo.k;
        if(LIVE){
          api("/api/clients/" + cl.cid + "/mood",
              {method:"POST", body:JSON.stringify({mood:next})})
            .then(scheduleRefresh)
            .catch(e => console.warn("пометка не сохранилась:", e.message));
          return;
        }
        cl.mood = next;
        cl.moodAt = cl.mood ? Date.now() : 0;
        cl.moodBy = cl.mood ? "Кирилл" : "";
        saveMoods();
        renderClients(); renderList();
        if(clientOf(byId(activeId)) === cl){ renderThread(); renderCard(); }
      };
      pm.append(b);
    });
    ms.append(pm);
    if(cl.moodAt){
      const w = el("div","kv","пометил " + cl.moodBy + " · " + dateShort(cl.moodAt));
      w.style.marginTop = "9px";
      ms.append(w);
    }
    card.append(ms);
    const del = el("button","pdel");
    del.type = "button";
    del.innerHTML = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2.8 4.2h10.4M6.4 4.2V2.8h3.2v1.4M4.2 4.2l.7 9a1 1 0 0 0 1 .9h4.2a1 1 0 0 0 1-.9l.7-9M6.6 6.8v4.6M9.4 6.8v4.6"/></svg>';
    del.append(document.createTextNode("Удалить клиента"));
    del.onclick = () => openCliDel([cl]);
    card.append(del);
    grid.append(card);

    const right = el("div");
    right.append(el("div","secttl","История обращений"));
    const rows = el("div","rows");
    cl.convs.map(byId).sort((a,b) => lastMsg(b).ts - lastMsg(a).ts).forEach(c => {
      const b = el("button","rrow");
      b.type = "button";
      const t = el("div","rt");
      const l1 = el("div","l1");
      l1.append(el("span","badge "+c.status, STATUS_L[c.status]));
      if(c.status === "archived") l1.append(folderChips(c));
      t.append(l1, el("div","q", c.topic));
      const side = el("div","rside", dateShort(lastMsg(c).ts));
      b.append(clientAvatar(cl), t, side);
      b.onclick = () => goInbox(c.id);
      rows.append(b);
    });
    right.append(rows);
    grid.append(right);

    body.append(grid);
    return;
  }

  /* ---- список всех клиентов ---- */
  $("#cliTitle").textContent = "База клиентов";
  $("#cliLead").textContent = "Кто обращался, с чем и как с ними разговаривать";
  $("#cliSearchBox").hidden = false;
  $("#cliSelBtn").hidden = !clients.length;
  $("#cliSelBtn").setAttribute("aria-pressed", String(cliSelecting));
  $("#cliSelBar").hidden = !cliSelecting;

  const list = clients.filter(clientMatches).sort((a,b) => lastContact(b) - lastContact(a));
  cliShown = list;
  renderCliSelBar();
  const marked = clients.filter(c => c.mood).length;
  $("#cliCount").textContent = clients.length + " " + plural(clients.length,"клиент","клиента","клиентов");
  hint.textContent = "Помечено " + marked + " из " + clients.length +
                     " · пометка ставится при отправке обращения в архив";

  if(!list.length){ body.append(emptyState("По запросу «"+cQuery+"» никого нет")); return; }

  const table = el("div","ctable" + (cliSelecting ? " selecting" : ""));
  list.forEach(cl => {
    const b = el("button","crow");
    b.type = "button";
    if(cliSelecting){
      b.setAttribute("role","checkbox");
      b.setAttribute("aria-checked", String(cliPicked.has(cl.id)));
      const box = el("span","cbx");
      box.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.3l2.3 2.3 4.7-5"/></svg>';
      b.append(box);
    }

    const c1 = el("div","c1");
    c1.append(el("b",null,cl.name), el("span",null,cl.org));

    const c2 = el("div","c2");
    const chip = moodChip(cl.mood);
    if(chip) c2.append(chip);
    else {
      const none = el("span","tag","без пометки");
      none.style.borderStyle = "dashed";
      c2.append(none);
    }
    c2.append(el("span","kv", cl.lic + " · " + cl.phone));

    const c3 = el("div","c3");
    if(cl.convs.length){
      c3.append(el("b",null,String(cl.convs.length)),
                document.createTextNode(plural(cl.convs.length,"обращение","обращения","обращений")));
    } else {
      c3.append(el("b",null,"—"), document.createTextNode("заполняет анкету"));
    }
    const when = el("div"); when.textContent = dateShort(lastContact(cl));
    when.style.marginTop = "4px";
    c3.append(when);

    b.append(clientAvatar(cl, 50), c1, c2, c3);
    b.onclick = () => {
      if(!cliSelecting){ openClient = cl.id; renderClients(); return; }
      if(cliPicked.has(cl.id)) cliPicked.delete(cl.id); else cliPicked.add(cl.id);
      b.setAttribute("aria-checked", String(cliPicked.has(cl.id)));
      renderCliSelBar();
    };
    // Строка — сама кнопка, поэтому корзину ставим рядом, а не внутрь
    const line = el("div","cline");
    line.append(b);
    if(!cliSelecting){
      const del = el("button","cdel");
      del.type = "button";
      del.title = "Удалить клиента";
      del.setAttribute("aria-label", "Удалить клиента " + cl.name);
      del.innerHTML = '<svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2.8 4.2h10.4M6.4 4.2V2.8h3.2v1.4M4.2 4.2l.7 9a1 1 0 0 0 1 .9h4.2a1 1 0 0 0 1-.9l.7-9M6.6 6.8v4.6M9.4 6.8v4.6"/></svg>';
      del.onclick = () => openCliDel([cl]);
      line.append(del);
    }
    table.append(line);
  });
  body.append(table);
}

/* ---------- удаление клиентов ----------
   Для чистки тестовых и мусорных записей: из карточки по одному или
   галочками сразу много. Стирается всё: карточка, обращения, файлы. */
let cliSelecting = false;
const cliPicked = new Set();
let cliShown = [];
let cliDelTargets = [];

function renderCliSelBar(){
  const n = cliPicked.size;
  $("#cliSelInfo").textContent = n
    ? "Выбрано " + n + " " + plural(n,"клиент","клиента","клиентов")
    : "Отметьте клиентов, которых нужно удалить";
  $("#cliSelDel").disabled = !n;
  $("#cliSelDel").textContent = n ? "Удалить " + n : "Удалить";
}

function setCliSelecting(on){
  cliSelecting = on;
  cliPicked.clear();
  renderClients();
}

function openCliDel(list){
  cliDelTargets = list;
  const n = list.length;
  $("#cdTitle").textContent = n === 1 ? "Удалить клиента навсегда?"
    : "Удалить " + n + " " + plural(n,"клиента","клиентов","клиентов") + " навсегда?";
  const box = $("#cdBody");
  const fill = s => {
    box.textContent = "";
    const row = (k, v) => { const d = el("div","drow"); d.append(el("dt",null,k), el("dd",null,v)); box.append(d); };
    if(n === 1) row("Клиент", list[0].name + (list[0].org && list[0].org !== "—" ? " · " + list[0].org : ""));
    else box.append(el("div","cdnames", list.map(c => c.name).join(", ")));
    row("Обращений", String(s.conversations));
    row("Сообщений", s.messages == null ? "считаю…" : String(s.messages));
    row("Вложений", s.files == null ? "считаю…" : String(s.files));
    if(s.active) box.append(el("div","cdactive",
      "⚠ " + s.active + " " + plural(s.active,"обращение ещё не в архиве","обращения ещё не в архиве","обращений ещё не в архиве") +
      " — живые разговоры тоже пропадут"));
  };
  const convIds = list.flatMap(c => c.convs);
  fill({conversations: convIds.length,
        active: convIds.map(byId).filter(c => c && c.status !== "archived").length,
        messages: LIVE ? null : convIds.map(byId).reduce((t,c) => t + (c ? c.msgs.length : 0), 0),
        files: LIVE ? null : 0});
  $("#cdOk").disabled = false;
  $("#cliDelModal").hidden = false;
  if(LIVE){
    api("/api/clients/summary", {method:"POST", body:JSON.stringify({ids: list.map(c => c.cid)})})
      .then(fill)
      .catch(e => console.warn("сводка не получена:", e.message));
  }
}

function closeCliDel(){ $("#cliDelModal").hidden = true; cliDelTargets = []; }

function confirmCliDel(){
  const list = cliDelTargets;
  if(!list.length) return;
  const gone = new Set(list.map(c => c.id));
  const finish = () => {
    if(openClient && gone.has(openClient)) openClient = null;
    cliSelecting = false; cliPicked.clear();
    closeCliDel();
  };
  if(!LIVE){
    for(let i = convs.length - 1; i >= 0; i--) if(gone.has(convs[i].client)) convs.splice(i, 1);
    for(let i = clients.length - 1; i >= 0; i--) if(gone.has(clients[i].id)){ delete CBY[clients[i].id]; clients.splice(i, 1); }
    if(!byId(activeId)) activeId = null;
    finish();
    renderClients(); renderFilters(); renderList(); renderThread(); renderCard();
    return;
  }
  $("#cdOk").disabled = true;
  api("/api/clients/delete", {method:"POST", body:JSON.stringify({ids: list.map(c => c.cid)})})
    .then(() => { finish(); renderClients(); scheduleRefresh(); })
    .catch(e => {
      $("#cdOk").disabled = false;
      $("#cdBody").append(el("div","cdactive","Не удалось удалить: " + e.message));
    });
}

/* ================= сервисная форма =================
   Итог разговора: сотрудник, данные клиента и темы плитками. Запись
   остаётся в пульте (вкладка «Итоги») и уходит в Google Таблицу —
   отправляет сервер. Без сервера (демо) записи живут в браузере. */
const SF_EMPLOYEES = ["Заварзин", "Гаев", "Шляпников", "Кирилин"];
const SF_EMP_COLORS = ["#2f9fe0", "#8a63e8", "#e5873a", "#2fb57a"];

// В Google Таблицу уходят прежние слова из старой формы
// service_form_google_v6.html, чтобы новые строки совпадали со старыми.
const SF_SHEET = {
  install:"Установка", download:"Скачать", driver:"Драйвер", remote:"Удалённое подключение",
  err_turbo:"Ошибка в Турбосметчике", err_build:"Ошибка в сборке",
  functions:"Функции программы", docprops:"Свойства документа",
  formulas:"Формулы и/или Итоговые начисления", correction:"Применить поправку",
  print:"Настройки печати", objsmeta:"Объектный сметчик", explnote:"Пояснительная записка",
  base_q:"Вопрос по базе", addon:"Выбрать дополнение", snb:"Преобразовать СНБ",
  indexes:"Вопрос по индексам", techpart:"Тех часть", pir:"ПИР", rzd:"РЖД",
  gge:"GGE/MGE Импорт/Экспорт", gge_exp:"Вопрос mge/gge от эксперта", arps:"АРПС",
  vor:"ВОР", pricelist:"Импорт прайс листа",
  method:"Вопрос по методике", consult:"Консультация", market:"Конъюнктурный анализ",
  nmck:"НМЦК Смета контракта", finderr:"Поиск ошибки в смете"
};
const SF_KEY = {};
Object.keys(SF_SHEET).forEach(k => { SF_KEY[SF_SHEET[k]] = k; });
const SF_FIELDS = ["serial","workplace","organization","subscription","phone","name","comment"];

let sfTab = "fill";
let sfForms = [];
let sfLoaded = false;
let sfLogQ = "";
let sfLogEmp = "";
let sfEmployee = store.get("sfEmployee", "");

const sfTopicColor = t => (FBY[SF_KEY[t]] || {}).c || "var(--ink-3)";
const sfEmpColor = n => SF_EMP_COLORS[SF_EMPLOYEES.indexOf(n)] || "#6b7e9a";
const sfSplit = v => v.split(",").map(s => s.trim()).filter(Boolean);
const sfPad = n => String(n).padStart(2, "0");

function sfTick(){
  const d = new Date();
  $("#sfDate").textContent = sfPad(d.getDate()) + "." + sfPad(d.getMonth()+1) + "." + d.getFullYear();
  $("#sfTime").textContent = sfPad(d.getHours()) + ":" + sfPad(d.getMinutes()) + ":" + sfPad(d.getSeconds());
}

function renderSfEmployees(){
  const box = $("#sfEmps");
  box.textContent = "";
  SF_EMPLOYEES.forEach(n => {
    const b = el("button","sfemp");
    b.type = "button";
    b.setAttribute("role","radio");
    b.setAttribute("aria-checked", String(sfEmployee === n));
    const i = el("i", null, n[0]);
    i.style.setProperty("--c", sfEmpColor(n));
    b.append(i, document.createTextNode(n));
    b.onclick = () => {
      sfEmployee = n; store.set("sfEmployee", n);
      box.classList.remove("need");
      renderSfEmployees();
    };
    box.append(b);
  });
}

function renderSfTiles(){
  const picked = sfSplit($("#sf_questions").value);
  const box = $("#sfTiles");
  box.textContent = "";
  // Раздел — строка: слева название, справа его темы кнопками с галочкой
  GROUPS.forEach(g => {
    const row = el("div","sfgrp");
    row.style.setProperty("--fc", g.c);
    const head = el("div","sfg");
    head.append(folderIcon(g, 26), document.createTextNode(g.n));
    const n = g.kids.filter(f => picked.includes(SF_SHEET[f.k])).length;
    if(n) head.append(el("b", null, String(n)));
    const pills = el("div","sfpills");
    g.kids.forEach(f => {
      const b = el("button","sfpill");
      b.type = "button";
      b.setAttribute("aria-pressed", String(picked.includes(SF_SHEET[f.k])));
      const ck = el("i");
      ck.innerHTML = '<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.3l2.3 2.3 4.7-5"/></svg>';
      b.append(ck, document.createTextNode(f.n));
      b.onclick = () => sfToggle(SF_SHEET[f.k]);
      pills.append(b);
    });
    row.append(head, pills);
    box.append(row);
  });
  $("#sfQn").textContent = picked.length ? "выбрано " + picked.length : "";
}

// Тема плиткой добавляется в строку через запятую, повторный клик убирает
function sfToggle(t){
  const area = $("#sf_questions");
  const items = sfSplit(area.value);
  const i = items.indexOf(t);
  if(i >= 0) items.splice(i, 1); else items.push(t);
  area.value = items.join(", ");
  renderSfTiles();
}

function sfMark(){
  SF_FIELDS.forEach(k => {
    const f = $("#sf_" + k);
    f.closest(".sff").classList.toggle("filled", !!f.value.trim());
  });
}

function sfMsg(text, kind){
  const m = $("#sfMsg");
  m.textContent = text || "";
  m.className = "sfmsg" + (kind ? " " + kind : "");
}

function sfClear(){
  SF_FIELDS.concat("questions").forEach(k => { $("#sf_" + k).value = ""; });
  sfMark(); renderSfTiles();
}

// Открытое обращение — подставить из него ключ, организацию, телефон, имя
function sfConv(){
  const c = activeId && byId(activeId);
  return c && !chatClosed ? c : null;
}
function renderSfPull(){
  const c = sfConv();
  $("#sfPull").hidden = !c;
  if(c) $("#sfPullTxt").textContent = "Из обращения: " + c.name;
}
function sfPull(){
  const c = sfConv();
  if(!c) return;
  const it = c.intake || {};
  const val = v => (v && v !== "—") ? v : "";
  const set = (k, v) => { if(val(v)) $("#sf_" + k).value = val(v); };
  set("serial", it.key);
  set("organization", it.org);
  set("phone", it.phone);
  set("name", val(it.fio) || c.name);
  sfMark();
  sfMsg("Данные из обращения подставлены", "wait");
}

async function sfSubmit(e){
  if(e) e.preventDefault();
  const btn = $("#sfSubmit");
  if(btn.classList.contains("busy")) return;

  if(!sfEmployee){
    const box = $("#sfEmps");
    box.classList.remove("need"); void box.offsetWidth; box.classList.add("need");
    sfMsg("Выберите сотрудника", "err");
    return;
  }
  const data = {employee: sfEmployee, questions: $("#sf_questions").value.trim()};
  SF_FIELDS.forEach(k => { data[k] = $("#sf_" + k).value.trim(); });
  if(!SF_FIELDS.some(k => data[k]) && !data.questions){
    sfMsg("Форма пустая — заполните хотя бы одно поле", "err");
    return;
  }

  btn.classList.add("busy");
  sfMsg("Отправляю в таблицу…", "wait");
  try{
    let row;
    if(LIVE){
      row = await api("/api/service-forms", {method:"POST", body:JSON.stringify(data)});
    } else {
      const d = new Date();
      row = Object.assign({}, data, {
        id: Date.now(), created_at: Date.now(), sent: 0,
        date: $("#sfDate").textContent, time: $("#sfTime").textContent,
        error: "Демо: без сервера в таблицу не отправляется"
      });
      const demo = store.get("sfDemo", []); demo.unshift(row); store.set("sfDemo", demo);
    }
    sfForms = [row].concat(sfForms.filter(f => f.id !== row.id));
    sfClear();
    renderSfCount();
    if(sfTab === "log") renderSfLog();
    const card = $("#sfFill .sfmain");
    card.classList.remove("sfdone"); void card.offsetWidth; card.classList.add("sfdone");
    if(row.sent) sfMsg("✓ Сохранено и отправлено в Google Таблицу · " + row.time, "ok");
    else sfMsg("Сохранено в пульте, но в таблицу не ушло: " + (row.error || "нет связи") + ". Повторить можно в «Итогах».", "err");
  }catch(err){
    sfMsg("Не сохранилось: " + err.message, "err");
  }finally{
    btn.classList.remove("busy");
  }
}

async function sfLoad(){
  if(LIVE){
    try{ sfForms = await api("/api/service-forms"); sfLoaded = true; }
    catch(e){ console.warn("сервисная форма:", e.message); }
  } else {
    sfForms = store.get("sfDemo", []); sfLoaded = true;
  }
  renderSfCount();
  if(sfTab === "log") renderSfLog();
}

function renderSfLog(){
  const empBox = $("#sfEmpFilter");
  empBox.textContent = "";
  ["", ...SF_EMPLOYEES].forEach(n => {
    const b = el("button","chip", n || "Все");
    b.type = "button";
    b.setAttribute("aria-pressed", String(sfLogEmp === n));
    b.onclick = () => { sfLogEmp = n; renderSfLog(); };
    empBox.append(b);
  });

  const q = sfLogQ.toLowerCase();
  const rows = sfForms.filter(f =>
    (!sfLogEmp || f.employee === sfLogEmp) &&
    (!q || [f.serial, f.workplace, f.organization, f.subscription, f.phone, f.name, f.comment, f.questions, f.employee, f.date]
            .join(" ").toLowerCase().includes(q)));

  const today = $("#sfDate").textContent;
  const unsent = sfForms.filter(f => !f.sent).length;
  const sum = $("#sfSum");
  sum.textContent = "";
  const stat = (n, t, cls) => { const s = el("span", cls); s.append(el("b", null, String(n)), document.createTextNode(t)); sum.append(s); };
  stat(sfForms.filter(f => f.date === today).length, "сегодня");
  stat(sfForms.length, "всего");
  if(unsent) stat(unsent, "не ушло в таблицу", "warn");

  const body = $("#sfLogBody");
  body.textContent = "";
  if(!rows.length){
    body.append(el("div","empty", !sfLoaded ? "Загружаю…" : sfForms.length ? "Ничего не нашлось" : "Пока нет ни одной заполненной формы"));
    return;
  }
  let day = "";
  rows.forEach(f => {
    if(f.date !== day){
      day = f.date;
      body.append(el("div","sfday", f.date === today ? "Сегодня · " + f.date : f.date));
    }
    const r = el("div","sfrow" + (f.sent ? "" : " unsent"));
    const tm = el("div","tm", (f.time || "").slice(0,5));

    const who = el("div","who");
    who.append(el("b", null, f.organization || f.name || "Без организации"));
    const sub = [f.organization ? f.name : "", f.serial && "ключ " + f.serial, f.workplace && "место " + f.workplace,
                 f.subscription && "подписка " + f.subscription, f.phone].filter(Boolean).join(" · ");
    if(sub) who.append(el("span", null, sub));

    const what = el("div","what");
    const items = sfSplit(f.questions || "");
    const known = items.filter(t => SF_KEY[t]);
    known.forEach(t => { const q = el("span","q", t); q.style.setProperty("--c", sfTopicColor(t)); what.append(q); });
    const free = items.filter(t => !known.includes(t)).join(", ");
    const text = [free, f.comment].filter(Boolean).join("\n");
    if(text) what.append(el("p", null, text));

    const st = el("div","st");
    const emp = el("span","emp");
    const dot = el("i"); dot.style.setProperty("--c", sfEmpColor(f.employee));
    emp.append(dot, document.createTextNode(f.employee || "—"));
    st.append(emp);
    if(f.sent){
      st.append(el("span","sfok", "✓ в таблице"));
    } else {
      if(LIVE && !f.error){
        st.append(el("span","sfbad wait", "отправляется…"));
      } else st.append(el("span","sfbad", "не ушло: " + (f.error || "нет связи")));
      if(LIVE && f.error){
        const again = el("button","ibtn", "Отправить ещё раз");
        again.type = "button";
        again.onclick = async () => {
          again.disabled = true; again.textContent = "Отправляю…";
          try{
            const row = await api("/api/service-forms/" + f.id + "/send", {method:"POST"});
            sfForms = sfForms.map(x => x.id === row.id ? row : x);
          }catch(e){ f.error = e.message; }
          renderSfLog();
        };
        st.append(again);
      }
    }
    r.append(tm, who, what, st);
    body.append(r);
  });
}

function openConv(id){
  activeId = id;
  chatClosed = false;
  const c = byId(id);
  if(c) c.unread = 0;
  $("#inbox").dataset.view = "thread";
  renderList(); renderThread(); renderCard();

  // В живом режиме переписка подтягивается только при открытии —
  // грузить историю всех диалогов сразу незачем
  if(LIVE && c && !c.loaded){
    loadMessages(c)
      .then(() => api("/api/conversations/" + c.sid,
                      {method:"PATCH", body:JSON.stringify({unread:0})}))
      .then(() => { if(activeId === id){ renderThread(); renderList(); } })
      .catch(e => console.warn("не удалось загрузить переписку:", e.message));
  }
}

/* ================= действия ================= */
function pushMsg(c, msg){ msg.id = c.id+"-"+(++c.seq); c.msgs.push(msg); }

function send(){
  const inp = $("#input");
  const text = inp.value.trim();
  const c = byId(activeId);
  if(!text || !c) return;

  if(LIVE){
    inp.value = ""; inp.style.height = "auto";
    $("#sendBtn").disabled = true;
    api("/api/conversations/" + c.sid + "/reply", {method:"POST", body:JSON.stringify({text:text})})
      .then(scheduleRefresh)
      .catch(e => {
        // Ответ не ушёл — оператор должен это увидеть, а не гадать
        pushMsg(c, {dir:"sys", t:"Не отправлено: " + e.message, ts:Date.now()});
        renderThread();
      });
    return;
  }

  pushMsg(c, {dir:"out", t:text, ts:Date.now(), st:"sent"});
  inp.value = ""; inp.style.height = "auto";
  $("#sendBtn").disabled = true;

  if(c.status === "new"){
    c.status = "open"; c.assignee = "Кирилл";
    pushMsg(c, {dir:"sys", t:"Обращение взято в работу: Кирилл", ts:Date.now()});
  }
  renderThread(); renderList(); renderCard(); renderFilters();

  const sent = c.msgs.filter(x => x.dir === "out").slice(-1)[0];
  setTimeout(() => { sent.st = "delivered"; if(activeId === c.id) renderThread(); }, 900);
  setTimeout(() => { sent.st = "read"; if(activeId === c.id) renderThread(); }, 2600);
}

const REPLIES = [
  "Спасибо, помогло! Программа запустилась.",
  "А счёт на юрлицо можете выставить?",
  "Хорошо, жду. Когда примерно ответите?",
  "Понял вас, попробую и отпишусь.",
  "Отправил файл на почту, проверьте, пожалуйста."
];

function simulateIncoming(conv){
  const pool = convs.filter(c => c.status !== "archived");
  const c = conv || pool[Math.floor(Math.random()*pool.length)];
  if(!c) return;
  c.pres = {state:"in", since:Date.now(), typing:true};
  typingIn = c.id;
  if(activeId === c.id && section === "inbox") renderThread();
  tickPresence();
  setTimeout(() => {
    typingIn = null;
    c.pres.typing = false;
    pushMsg(c, {dir:"in", t:REPLIES[Math.floor(Math.random()*REPLIES.length)], ts:Date.now()});
    if(c.status === "waiting") c.status = "open";
    if(activeId !== c.id) c.unread++;
    renderList(); renderFilters();
    if(activeId === c.id){ renderThread(); renderCard(); }
  }, 1500);
}

function shufflePresence(){
  const pool = convs.filter(c => c.status !== "archived" && c.status !== "closed");
  if(!pool.length) return;
  const c = pool[Math.floor(Math.random()*pool.length)];
  const r = Math.random();
  if(r < 0.34)      c.pres = {state:"in", since:Date.now(), typing:false};
  else if(r < 0.67) c.pres = {state:"in", since:Date.now()-m(7), typing:true};
  else              c.pres = {state:"left", since:Date.now()-m(9), typing:false};
  tickPresence();
}

/* ================= окно выбора папки =================
   То же дерево, что в разделе «Архив»: раздел сверху, его темы плитками.
   Оператор узнаёт папку по месту и цвету, а не читает список. */
function renderFolderList(){
  const box = $("#folderList");
  const q = $("#mSearch").value.trim();
  box.textContent = "";
  const archived = convs.filter(c => c.status === "archived");
  // Клик по теме добавляет её к выбору, повторный — убирает.
  // «Не определённая тема» — только сама по себе.
  const pick = key => {
    if(GBY[key]) return;
    if(key === "undef") pendingFolders = pendingFolders.includes("undef") ? [] : ["undef"];
    else {
      pendingFolders = pendingFolders.filter(k => k !== "undef");
      pendingFolders = pendingFolders.includes(key)
        ? pendingFolders.filter(k => k !== key)
        : pendingFolders.concat([key]);
    }
    $("#mOk").disabled = !pendingFolders.length;
    renderFolderList();
  };
  box.append(folderTree(archived, pick, {compact:true, filter:q, selected:pendingFolders}));
  box.append(el("div","fdivide","если ничего не подходит"));
  box.append(undefTile(archived, pick, pendingFolders.includes("undef")));
  const names = pendingFolders.map(k => FBY[k] ? FBY[k].n : k);
  $("#mPicked").textContent = !names.length ? "Можно выбрать несколько папок"
    : (names.length === 1 ? "Папка: " : "Папок: " + names.length + " — ") + names.join(", ");
  $("#mPicked").title = names.join(", ");
}

function renderMoodList(){
  const box = $("#moodList");

  MOODS.forEach(mo => {
    const b = el("button","moodopt");
    b.type = "button";

    b.dataset.mood = mo.k;
    b.setAttribute("aria-pressed", String(pendingMood === mo.k));
    b.title = mo.hint;
    const t = el("div");
    t.append(el("b",null,mo.n), el("span",null,mo.hint));
    b.append(el("i","mo"), t);
    b.onclick = () => { pendingMood = pendingMood === mo.k ? null : mo.k; renderMoodList(); };
    box.append(b);
  });
}

  const c = byId(activeId);
  if(!c) return;
  const cl = clientOf(c);
  pendingMood = cl ? (cl.mood || null) : null;
  renderMoodList();
  pendingFolders = foldersOf(c).slice();
  $("#mSub").textContent = c.status === "archived"
    ? "Обращение уже в архиве. Отметьте другие папки, если тема определилась точнее."
    : "«"+c.topic+"» уйдёт в архив. Отметьте все подходящие темы — можно несколько.";

  $("#mOk").disabled = !pendingFolders.length;
  $("#mOk").textContent = c.status === "archived" ? "Переместить" : "Отправить в архив";
  $("#archiveModal").hidden = false;
  renderFolderList();
  setTimeout(() => $("#mSearch").focus(), 30);
}
function closeArchiveModal(){
  $("#archiveModal").hidden = true;
  pendingFolders = [];
  const c = byId(activeId);
  if(c) $("#statusSel").value = c.status;
}
function confirmArchive(){
  const c = byId(activeId);
  if(!c || !pendingFolders.length) return;
  const picked = pendingFolders.slice();

  if(LIVE){
    const mood = pendingMood || "";
    api("/api/conversations/" + c.sid + "/archive",
        {method:"POST", body:JSON.stringify({folders:picked, mood:mood})})
      .then(() => { closeArchiveModal(); scheduleRefresh(); })
      .catch(e => {
        closeArchiveModal();
        pushMsg(c, {dir:"sys", t:"Не удалось убрать в архив: " + e.message, ts:Date.now()});
        renderThread();
      });
    return;
  }
  const was = c.status === "archived";
  c.status = "archived"; c.folders = picked; c.folder = picked[0]; c.unread = 0;
  const names = picked.map(k => "«" + FBY[k].n + "»").join(", ");
  pushMsg(c, {dir:"sys", t:(was ? "Папки изменены → " : "Обращение отправлено в архив → " +
                                  (picked.length > 1 ? "папки " : "папка ")) + names, ts:Date.now()});

  // Пометка ставится человеку и остаётся с ним после закрытия обращения
  const cl = clientOf(c);
  if(cl && pendingMood !== (cl.mood || null)){
    cl.mood = pendingMood || "";
    cl.moodAt = pendingMood ? Date.now() : 0;
    cl.moodBy = pendingMood ? "Кирилл" : "";
    saveMoods();
    pushMsg(c, {dir:"sys",
      t: pendingMood ? "Клиент помечен: " + MBY[pendingMood].n.toLowerCase()
                     : "Пометка о клиенте снята",
      ts:Date.now()});
  }

  closeArchiveModal();
  renderFilters(); renderList(); renderThread(); renderCard();
  if(section === "archive") renderArchive();
  if(section === "clients") renderClients();
}

/* ================= прикреплённый файл ================= */
let pendingFile = null;

function humanSize(n){
  if(n < 1024) return n + " Б";
  if(n < 1024*1024) return Math.round(n/1024) + " КБ";
  return (n/1024/1024).toFixed(1).replace(".", ",") + " МБ";
}

function renderPending(){
  const box = $("#pendingFile");
  box.textContent = "";
  if(!pendingFile){ box.hidden = true; return; }
  box.hidden = false;

  if(/^image\//.test(pendingFile.type)){
    const img = document.createElement("img");
    img.className = "thumb";
    img.src = URL.createObjectURL(pendingFile);
    img.onload = () => URL.revokeObjectURL(img.src);
    box.append(img);
  }
  box.append(el("span","pn", pendingFile.name), el("span","ps", humanSize(pendingFile.size)));

  const x = el("button","px","×");
  x.type = "button";
  x.title = "Убрать файл";
  x.onclick = () => { pendingFile = null; $("#fileInput").value = ""; renderPending(); syncSend(); };
  box.append(x);
}

function syncSend(){
  const inp = $("#input");
  $("#sendBtn").disabled = !inp.value.trim() && !pendingFile;
  $("#sendBtn").textContent = pendingFile ? "Отправить" : "Ответить";
}

function sendFile(){
  const c = byId(activeId);
  if(!c || !pendingFile) return;
  const caption = $("#input").value.trim();

  if(!LIVE){
    pushMsg(c, {dir:"out", ts:Date.now(), st:"sent", t:caption,
                att:{n:pendingFile.name, s:humanSize(pendingFile.size), k:"ФАЙЛ",
                     url:"", kind:/^image\//.test(pendingFile.type) ? "image" : "file"}});
    pendingFile = null; $("#fileInput").value = ""; $("#input").value = "";
    renderPending(); syncSend(); renderThread(); renderList();
    return;
  }

  const form = new FormData();
  form.append("file", pendingFile);
  form.append("caption", caption);
  $("#pendingFile").classList.add("sending");

  fetch("/api/conversations/" + c.sid + "/attach", {method:"POST", body:form})
    .then(async r => {
      if(!r.ok){
        let detail = "HTTP " + r.status;
        try{ detail = (await r.json()).detail || detail; }catch(e){}
        throw new Error(detail);
      }
      pendingFile = null;
      $("#fileInput").value = "";
      $("#input").value = "";
      $("#input").style.height = "auto";
      scheduleRefresh();
    })
    .catch(e => {
      pushMsg(c, {dir:"sys", t:"Файл не отправлен: " + e.message, ts:Date.now()});
      renderThread();
    })
    .finally(() => {
      $("#pendingFile").classList.remove("sending");
      renderPending(); syncSend();
    });
}

  if(!c) return;

  if(!LIVE){
    const i = convs.indexOf(c);
    if(i >= 0) convs.splice(i, 1);
    const cl = CBY[c.client];
    if(cl) cl.convs = cl.convs.filter(id => id !== c.id);
    activeId = convs.length ? convs[0].id : null;
    closeDeleteModal();
    renderFilters(); renderList(); renderThread(); renderCard();
    if(section === "archive") renderArchive();
    if(section === "clients") renderClients();
    return;
  }

  api("/api/conversations/" + c.sid, {method:"DELETE"})
    .then(() => {
      activeId = null;
      closeDeleteModal();
      scheduleRefresh();
      if(section === "inbox") setSection("archive");
    })
    .catch(e => {
      closeDeleteModal();
      pushMsg(c, {dir:"sys", t:"Не удалось удалить: " + e.message, ts:Date.now()});
      renderThread();
    });
}

/* ================= привязки ================= */
const input = $("#input");
input.addEventListener("input", () => {
  syncSend();
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 150)+"px";
});
function submit(){ if(pendingFile) sendFile(); else send(); }
input.addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); submit(); } });
$("#sendBtn").onclick = submit;

$("#fileBtn").onclick = () => $("#fileInput").click();
$("#fileInput").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  if(f.size > 20 * 1024 * 1024){
    alert("Файл больше 20 МБ — столько мессенджер не примет.");
    e.target.value = "";
    return;
  }
  pendingFile = f;
  renderPending(); syncSend(); input.focus();
});

$("#deleteBtn").onclick = openDeleteModal;
$("#dClose").onclick = closeDeleteModal;
$("#dCancel").onclick = closeDeleteModal;
$("#dOk").onclick = confirmDelete;
$("#deleteModal").addEventListener("click", e => { if(e.target.id === "deleteModal") closeDeleteModal(); });
$("#q").addEventListener("input", e => { query = e.target.value.trim(); renderList(); });

$("#statusSel").onchange = e => {
  const c = byId(activeId);
  if(!c) return;
  if(e.target.value === "archived"){ openArchiveModal(); return; }
  if(LIVE){
    api("/api/conversations/" + c.sid, {method:"PATCH", body:JSON.stringify({status:e.target.value})})
      .then(scheduleRefresh)
      .catch(err => console.warn("статус не сохранился:", err.message));
    return;
  }
  c.status = e.target.value;
  c.folder = ""; c.folders = [];
  pushMsg(c, {dir:"sys", t:"Статус изменён: "+STATUS_L[c.status], ts:Date.now()});
  renderFilters(); renderList(); renderThread(); renderCard();
};

$("#archiveBtn").onclick = openArchiveModal;
$("#mClose").onclick = closeArchiveModal;
$("#mCancel").onclick = closeArchiveModal;
$("#mOk").onclick = confirmArchive;
$("#mSearch").addEventListener("input", renderFolderList);
$("#archiveModal").addEventListener("click", e => { if(e.target.id === "archiveModal") closeArchiveModal(); });

$("#navInbox").onclick = () => setSection("inbox");
$("#navClients").onclick = () => { openClient = null; setSection("clients"); };
$("#navArchive").onclick = () => { openFolder = null; setSection("archive"); };
$("#navService").onclick = () => setSection("service");
$("#sfTabFill").onclick = () => setSfTab("fill");
$("#sfTabLog").onclick = () => setSfTab("log");
$("#sfFill").addEventListener("submit", sfSubmit);
$("#sfFill").addEventListener("keydown", e => {
  if(e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); sfSubmit(); }
  // Enter в коротком поле переходит к следующему, а не отправляет форму
  else if(e.key === "Enter" && e.target.tagName === "INPUT"){
    e.preventDefault();
    const list = [...$("#sfFill").querySelectorAll("input, textarea")];
    const next = list[list.indexOf(e.target) + 1];
    if(next) next.focus();
  }
});
$("#sfFill").addEventListener("input", e => {
  if(e.target.id === "sf_questions") renderSfTiles();
  sfMark();
});
$("#sfReset").onclick = () => { sfClear(); sfMsg(""); };
$("#sfPull").onclick = sfPull;
$("#sfLogQ").addEventListener("input", e => { sfLogQ = e.target.value.trim(); renderSfLog(); });
setInterval(() => { if(section === "service") sfTick(); }, 1000);
$("#cliQ").addEventListener("input", e => { cQuery = e.target.value.trim(); renderClients(); });
$("#cliSelBtn").onclick = () => setCliSelecting(!cliSelecting);
$("#cliSelCancel").onclick = () => setCliSelecting(false);
$("#cliSelAll").onclick = () => { cliShown.forEach(c => cliPicked.add(c.id)); renderClients(); };
$("#cliSelDel").onclick = () => { const l = clients.filter(c => cliPicked.has(c.id)); if(l.length) openCliDel(l); };
$("#cdClose").onclick = closeCliDel;
$("#cdCancel").onclick = closeCliDel;
$("#cdOk").onclick = confirmCliDel;
$("#cliDelModal").addEventListener("click", e => { if(e.target.id === "cliDelModal") closeCliDel(); });
$("#cliClear").onclick = () => { $("#cliQ").value = ""; cQuery = ""; renderClients(); $("#cliQ").focus(); };
$("#navIntake").onclick = () => { renderScript(); $("#intakeModal").hidden = false; };
$("#iClose").onclick = () => { $("#intakeModal").hidden = true; };
$("#iOk").onclick = () => { $("#intakeModal").hidden = true; };
$("#intakeModal").addEventListener("click", e => { if(e.target.id === "intakeModal") $("#intakeModal").hidden = true; });

$("#aq").addEventListener("input", e => {
  aQuery = e.target.value;
  // Вопрос «сколько…» — это про цифры, а не про поиск обращения
  if(aMode === "find" && ASK_RX.test(aQuery)){ setMode("ask"); return; }
  if(aMode === "find") renderArchive();
  else $("#aClear").hidden = !aQuery;
});
$("#aq").addEventListener("keydown", e => {
  if(e.key === "Enter" && aMode === "ask"){ e.preventDefault(); runAsk(aQuery); }
});
$("#aClear").onclick = () => { $("#aq").value = ""; aQuery = ""; askState = null; renderArchive(); $("#aq").focus(); };
$("#modeFind").onclick = () => { if(aMode !== "find"){ setMode("find"); $("#aq").focus(); } };
$("#modeAsk").onclick = () => { if(aMode !== "ask"){ setMode("ask"); $("#aq").focus(); } };

document.addEventListener("keydown", e => {
  if(e.key === "Escape"){
    const modalOpen = !$("#archiveModal").hidden || !$("#intakeModal").hidden || !$("#deleteModal").hidden;
    if(!modalOpen && $("#calBox").hidden && section === "inbox" && activeId &&
       document.activeElement !== $("#input")) closeChat();
    if(!$("#archiveModal").hidden) closeArchiveModal();
    if(!$("#intakeModal").hidden) $("#intakeModal").hidden = true;
    if(!$("#deleteModal").hidden) closeDeleteModal();
    if(!$("#cliDelModal").hidden) closeCliDel();
    return;
  }
  if(!$("#archiveModal").hidden && e.key === "Enter" && pendingFolders.length &&
     document.activeElement !== $("#mSearch")) confirmArchive();
});

$("#backBtn").onclick = closeChat;
$("#cardBtn").onclick = () => {
  const box = $("#inbox");
  box.dataset.card = box.dataset.card === "open" ? "" : "open";
};
$("#simBtn").onclick = () => simulateIncoming(byId(activeId));

const tplMenu = $("#tplMenu");
TEMPLATES.forEach(t => {
  const b = el("button");
  b.type = "button";
  b.append(el("b",null,t.t), document.createTextNode(t.v.slice(0,74)+"…"));
  b.onclick = () => { input.value = t.v; tplMenu.hidden = true; input.dispatchEvent(new Event("input")); input.focus(); };
  tplMenu.append(b);
});
$("#tplBtn").onclick = e => { e.stopPropagation(); tplMenu.hidden = !tplMenu.hidden; };
document.addEventListener("click", e => { if(!tplMenu.hidden && !tplMenu.contains(e.target)) tplMenu.hidden = true; });

$("#themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  store.set("theme", next);
};
const saved = store.get("theme", null);
if(saved) document.documentElement.setAttribute("data-theme", saved);

/* ================= старт ================= */
if(innerWidth > 820) $("#inbox").dataset.view = "thread";

// Страницу отдал сервер — демо-обращения не показываем ни на миг,
// иначе оператор путает их с настоящими, пока грузится база
if(window.TP_SERVER){
  convs.length = 0;
  clients.length = 0;
  Object.keys(CBY).forEach(k => delete CBY[k]);
  activeId = null;
  $("#demoTag").textContent = "подключаюсь…";
}
renderFilters(); renderList(); renderThread(); renderCard();

setInterval(tickPresence, 5000);

liveBoot().then(live => {
  if(live) return;
  // Бэкенда рядом нет — страница работает как самостоятельное демо
  $("#simBtn").hidden = false;
  setInterval(shufflePresence, 11000);
  setInterval(() => { if(!document.hidden) simulateIncoming(); }, 45000);
});

})();
</script>
